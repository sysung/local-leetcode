edition = "2023";

// Package declaration prevents naming conflicts between different projects 
package tutorial;

// Tag numbers 1-15 are used for common elements since they require one less byte to encode than higher numbers
// Tag numbers 16+ are for less-commonly used optional elements
message Person {
    string name = 1;
    int32 id = 2;
    string email = 3;

    enum PhoneType {
        PHONE_TYPE_UNSPECIFIED = 0;
        PHONE_TYPE_MOBILE = 1;
        PHONE_TYPE_HOME = 2;
        PHONE_TYPE_WORK = 3;
    }

    message PhoneNumber {
        string number = 1;
        PhoneType type = 2 [default = PHONE_TYPE_HOME];
    }

    repeated PhoneNumber phones = 4;
}

message AddressBook {
    repeated Person people = 1;
}
